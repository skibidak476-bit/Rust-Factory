<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rezavá továrna — idle těžební</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141210; --card:#1e1a16; --border:#3a322a; --fg:#e8e0d4; --muted:#9a8f80;
  --primary:#e0862a; --primary-fg:#1a120a; --secondary:#2a251f;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Chakra Petch',sans-serif;color:var(--fg)}
#wrap{position:relative;width:100vw;height:100vh;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;user-select:none}
.panel{background:rgba(30,26,22,.92);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);backdrop-filter:blur(6px)}
.brand{position:absolute;left:12px;top:12px;padding:8px 12px}
.brand-title{font-size:14px;font-weight:700;letter-spacing:.15em;color:var(--primary)}
.brand-sub{font-size:10px;color:var(--muted)}
#right{position:absolute;right:12px;top:12px;width:288px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.money-panel{padding:12px}
.money{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:var(--primary)}
.inv-toggle{display:flex;width:100%;align-items:center;justify-content:space-between;padding:8px 12px;background:none;border:none;color:inherit;cursor:pointer;font:inherit}
#inv-list{display:flex;flex-direction:column;gap:4px;padding:0 8px 8px}
.inv-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(42,37,31,.6);border-radius:8px;padding:6px 8px}
.inv-info{min-width:0}
.inv-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-desc{font-size:10px;color:var(--muted)}
.inv-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.inv-count{font-family:'IBM Plex Mono',monospace;font-size:13px}
.btn-primary{background:var(--primary);color:var(--primary-fg);border:none;border-radius:6px;font:inherit;font-weight:600;cursor:pointer}
.btn-primary:disabled{opacity:.3;cursor:default}
.btn-sm{padding:4px 8px;font-size:11px}
.btn-wide{width:100%;padding:8px 12px;font-size:14px;margin-top:12px}
.res-panel{padding:12px}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.res-cell{display:flex;align-items:center;justify-content:space-between;background:rgba(42,37,31,.6);border-radius:8px;padding:4px 8px;font-size:12px}
.res-name{display:flex;align-items:center;gap:6px}
.res-val{font-family:'IBM Plex Mono',monospace;font-size:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.4)}
.dot-sm{width:8px;height:8px;margin-right:5px}
.hint{font-size:10px;line-height:1.4;color:var(--muted);margin-top:6px}
.quest-panel{padding:12px}
.quest-head{display:flex;align-items:baseline;justify-content:space-between}
.quest-mode{font-size:10px;color:var(--muted)}
.quest-title{font-size:12px;font-weight:600;margin-top:2px}
.quest-goals{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.quest-goal-row{display:flex;align-items:center;justify-content:space-between;font-size:11px}
.bar{margin-top:2px;height:4px;border-radius:99px;background:var(--secondary);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--primary);transition:width .2s}
.coords{padding:8px 12px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(30,26,22,.95);border:1px solid rgba(224,134,42,.6);border-radius:8px;padding:8px 16px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(30,26,22,.95);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.controls{position:absolute;bottom:12px;left:12px;padding:8px 12px;font-size:11px;line-height:1.6;color:var(--muted)}
.controls b{color:var(--fg)}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:380px;max-width:92vw;background:rgba(30,26,22,.96);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 16px 48px rgba(0,0,0,.6);pointer-events:auto}
.modal-wide{width:440px}
.modal-head{display:flex;align-items:baseline;justify-content:space-between}
.modal-head h2{font-size:18px;font-weight:700;letter-spacing:.15em}
.money-sm{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--primary)}
.modal-sub{margin-top:2px;font-size:11px;color:var(--muted)}
.merchant-grid{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:4px;max-height:45vh;overflow-y:auto}
.shop-body{margin-top:12px;max-height:55vh;overflow-y:auto;padding-right:4px;display:flex;flex-direction:column;gap:12px}
.shop-group{margin-bottom:4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.fg{color:var(--fg)}
.fg-primary{color:var(--primary)}
</style>
</head>
