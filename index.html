<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rezavá továrna — idle těžební hra</title>
<meta name="description" content="Buduj pásy, generátory, smelter, polisher a crafteře, těž rudy a plň úkoly v idle továrně." />
<style>
  :root {
    --bg: #0b0c0e;
    --card: #16181c;
    --border: #2a2e35;
    --fg: #e8e2d4;
    --muted: #9aa0a8;
    --primary: #d9a441;
    --secondary: #22262c;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    color: var(--fg);
    user-select: none;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .panel {
    background: rgba(22, 24, 28, 0.92);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    backdrop-filter: blur(6px);
  }
  #brand { position: absolute; left: 12px; top: 12px; padding: 8px 12px; pointer-events: none; }
  #brand .t { font-size: 14px; font-weight: 700; letter-spacing: 3px; color: var(--primary); }
  #brand .s { font-size: 10px; color: var(--muted); }
  #right {
    position: absolute; right: 12px; top: 12px; width: 288px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .box { padding: 10px 12px; }
  .label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  #money { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 24px; font-weight: 600; color: var(--primary); }
  #invToggle {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    background: none; border: none; color: inherit; font: inherit; cursor: pointer; padding: 0;
  }
  #invList { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .row {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: rgba(34, 38, 44, 0.7); border-radius: 8px; padding: 6px 8px;
  }
  .row-info { min-width: 0; }
  .row-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-sub { font-size: 10px; color: var(--muted); }
  .row-act { display: flex; align-items: center; gap: 6px; font-size: 13px; flex-shrink: 0; }
  .btn {
    background: var(--primary); color: #14100a; border: none; border-radius: 6px;
    padding: 4px 8px; font-size: 11px; font-weight: 700; font-family: inherit; cursor: pointer;
  }
  .btn:disabled { opacity: 0.3; cursor: default; }
  #resList { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 6px; }
  .res {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(34, 38, 44, 0.7); border-radius: 8px; padding: 4px 8px; font-size: 12px;
  }
  .res-label { display: flex; align-items: center; gap: 6px; }
  .dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.4); flex-shrink: 0;
  }
  .hint { font-size: 10px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
  .quest-mode { float: right; font-size: 10px; color: var(--muted); }
  .quest-title { font-size: 12px; font-weight: 600; margin-top: 2px; }
  .goal { margin-top: 6px; }
  .goal-row { display: flex; justify-content: space-between; font-size: 11px; }
  .bar { height: 4px; background: var(--secondary); border-radius: 999px; margin-top: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--primary); border-radius: 999px; transition: width 0.3s; }
  .quest-reward { font-size: 10px; color: var(--muted); margin-top: 8px; }
  .quest-reward b { color: var(--fg); }
  .quest-done { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #coords { padding: 8px 12px; font-size: 12px; color: var(--muted); }
  #placement {
    position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
    padding: 8px 16px; font-size: 12px; border-color: rgba(217,164,65,0.6);
    pointer-events: none; display: none;
  }
  #placement b { color: var(--primary); }
  #toast {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    padding: 8px 16px; font-size: 14px; pointer-events: none; display: none;
    max-width: 90vw; text-align: center;
  }
  #controls {
    position: absolute; bottom: 12px; left: 12px; padding: 8px 12px;
    font-size: 11px; color: var(--muted); line-height: 1.7; pointer-events: none;
  }
  #controls b { color: var(--fg); }
  #shop {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 440px; max-width: 92vw; padding: 16px; display: none;
  }
  #shop h2 { font-size: 18px; letter-spacing: 3px; display: inline; }
  #shopMoney { float: right; font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--primary); }
  #shop .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  #shopBody { margin-top: 12px; max-height: 55vh; overflow-y: auto; padding-right: 4px; }
  .shop-group { margin-bottom: 12px; }
  .shop-group-title { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .shop-group .row { margin-bottom: 4px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="brand" class="panel">
  <div class="t">REZAVÁ TOVÁRNA</div>
  <div class="s">idle těžební prototyp</div>
</div>

<div id="right">
  <div class="panel box">
    <div class="label">Peníze</div>
    <div id="money">0</div>
  </div>

  <div class="panel box">
    <button id="invToggle">
      <span class="label">Inv — stroje</span>
      <span id="invToggleArrow" style="font-size:12px;color:var(--muted)">▾</span>
    </button>
    <div id="invList"></div>
  </div>

  <div class="panel box">
    <div class="label">Suroviny</div>
    <div id="resList"></div>
    <div class="hint">Prodat vše můžeš u obchodníka (−10, −10) nebo pásem.</div>
  </div>

  <div class="panel box">
    <span class="label">Úkol</span>
    <div id="questBody"></div>
  </div>

  <div id="coords" class="panel mono"></div>
</div>

<div id="placement" class="panel"></div>
<div id="toast" class="panel"></div>

<div id="controls" class="panel">
  <div><b>WASD / šipky</b> pohyb · přejdi přes věc = sebrat</div>
  <div><b>Obchod</b> (10, 10) · <b>Obchodník</b> (−10, −10)</div>
</div>

<div id="shop" class="panel">
  <h2>OBCHOD</h2>
  <span id="shopMoney"></span>

  <div id="shopBody"></div>
</div>
